<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Little Surprise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;1,600&family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-top:#140F2B;
    --bg-bottom:#1F1640;
    --card:#241B49;
    --cream:#FBF7F0;
    --cream-dim:#CFC8E8;
    --gold:#F5B942;
    --coral:#FF6B6B;
    --teal:#4ECDC4;
    --lavender:#B8A4FF;
    --box-w:clamp(180px,50vw,261px);
    --box-h:clamp(140px,39vw,203px);
    --lid-w:clamp(198px,55vw,287px);
    --lid-h:clamp(34px,9.5vw,49px);
    --bow-w:clamp(64px,17.8vw,93px);
    --ribbon:clamp(26px,7.2vw,38px);
  }

  *{box-sizing:border-box;}

  html,body{
    height:100%;
    margin:0;
    background:var(--bg-top);
    overscroll-behavior:none;
  }

  body{
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    padding:24px 16px;
    font-family:'Nunito', system-ui, sans-serif;
    color:var(--cream);
    background:radial-gradient(ellipse at 50% -10%, var(--bg-bottom), var(--bg-top) 70%);
    overflow-x:hidden;
    position:relative;
  }

  .stars{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;
  }
  .star{
    position:absolute;
    width:3px;
    height:3px;
    border-radius:50%;
    background:var(--cream);
    opacity:0.5;
    animation:twinkle 2.6s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{opacity:0.15;}
    50%{opacity:0.8;}
  }

  main{
    position:relative;
    z-index:1;
    width:100%;
    max-width:560px;
    margin:auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:clamp(24px,5.5vh,36px);
    text-align:center;
  }

  h1{
    font-family:'Fredoka', system-ui, sans-serif;
    font-weight:600;
    font-size:clamp(34px,9.5vw,52px);
    letter-spacing:0.3px;
    margin:0;
    text-wrap:balance;
    color:var(--cream);
    transition:opacity .4s ease;
  }

  .tagline{
    margin:0;
    font-size:clamp(16px,4.2vw,19px);
    color:var(--cream-dim);
    font-style:italic;
    transition:opacity .4s ease;
  }

  h1.intro-fade,
  .tagline.intro-fade{
    opacity:0;
    pointer-events:none;
  }

  canvas#confetti{
    position:fixed;
    inset:0;
    z-index:5;
    pointer-events:none;
  }

  /* ---- Present ---- */
  .present-wrap{
    position:relative;
    width:clamp(240px,66vw,320px);
    height:clamp(240px,66vw,320px);
    display:flex;
    align-items:flex-end;
    justify-content:center;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }

  .present-wrap.opened{cursor:default;}

  .box{
    position:relative;
    width:var(--box-w);
    height:var(--box-h);
    background:linear-gradient(135deg, var(--coral), #e85a5a);
    border-radius:10px;
    box-shadow:0 18px 40px -10px rgba(0,0,0,0.55);
    transition:transform .5s ease, opacity .5s ease;
  }

  .box::before,.box::after{
    content:"";
    position:absolute;
    background:var(--gold);
  }
  /* vertical ribbon */
  .box::before{
    width:var(--ribbon);
    left:50%;
    top:0;
    bottom:0;
    transform:translateX(-50%);
  }
  /* horizontal ribbon */
  .box::after{
    height:var(--ribbon);
    top:50%;
    left:0;
    right:0;
    transform:translateY(-50%);
  }

  .lid{
    position:absolute;
    bottom:var(--box-h);
    left:50%;
    transform:translateX(-50%);
    width:var(--lid-w);
    height:var(--lid-h);
    background:linear-gradient(135deg, #ff8080, var(--coral));
    border-radius:8px;
    box-shadow:0 8px 16px -6px rgba(0,0,0,0.4);
    transition:transform .6s cubic-bezier(.3,1.4,.6,1), opacity .5s ease;
    z-index:2;
  }
  .lid::after{
    content:"";
    position:absolute;
    width:var(--ribbon);
    top:-20px;
    left:50%;
    height:44px;
    transform:translateX(-50%);
    background:var(--gold);
    border-radius:50% 50% 0 0;
  }

  .bow{
    position:absolute;
    left:50%;
    top:-26px;
    transform:translateX(-50%);
    width:var(--bow-w);
    height:var(--lid-h);
    z-index:3;
    transition:transform .5s ease, opacity .5s ease;
  }
  .bow::before,.bow::after{
    content:"";
    position:absolute;
    width:44px;
    height:44px;
    background:var(--gold);
    border-radius:60% 60% 60% 0;
    top:0;
  }
  .bow::before{left:0; transform:rotate(-40deg);}
  .bow::after{right:0; transform:rotate(40deg) scaleX(-1);}

  .present-wrap.opened .lid{
    transform:translate(-120%,-70px) rotate(-50deg);
    opacity:0;
  }
  .present-wrap.opened .bow{
    transform:translate(60%,-60px) rotate(50deg);
    opacity:0;
  }
  .present-wrap.opened .box{
    transform:scale(0.85);
    opacity:0;
  }

  /* ---- Fireworks ---- */
  .firework-label{
    position:fixed;
    left:0;
    top:0;
    width:clamp(92px, 32vw, 150px);
    z-index:6;
    pointer-events:none;
    font-family:'Fredoka', system-ui, sans-serif;
    font-weight:600;
    font-size:clamp(13px,4.2vw,17px);
    line-height:1.25;
    text-align:center;
    text-shadow:0 0 10px currentColor, 0 0 24px currentColor;
    opacity:0;
    animation:fireworkPop 1.5s ease-out forwards;
  }
  @keyframes fireworkPop{
    0%{opacity:0; transform:translate(-50%,-50%) scale(0.35);}
    18%{opacity:1; transform:translate(-50%,-50%) scale(1.1);}
    30%{transform:translate(-50%,-50%) scale(1);}
    78%{opacity:1; transform:translate(-50%,-50%) scale(1);}
    100%{opacity:0; transform:translate(-50%,-50%) scale(1.15);}
  }

  /* ---- Reveal ---- */
  .reveal[hidden]{
    display:none;
  }
  .reveal{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:18px;
    opacity:0;
    transform:translate(0,0) scale(1);
    transition:opacity .5s ease, transform .8s cubic-bezier(.17,.89,.32,1.49);
    pointer-events:none;
  }
  .reveal.show{
    opacity:1;
    pointer-events:auto;
  }

  .frame{
    width:min(90vw,380px);
    aspect-ratio:4/5;
    border-radius:18px;
    background:var(--card);
    border:3px solid var(--lavender);
    box-shadow:0 20px 50px -15px rgba(0,0,0,0.6);
    padding:12px;
    display:flex;
  }
  .frame img,
  .frame .placeholder{
    width:100%;
    height:100%;
    border-radius:10px;
    object-fit:cover;
  }
  .placeholder[hidden]{
    display:none;
  }
  .placeholder{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    text-align:center;
    padding:20px;
    background:
      repeating-linear-gradient(45deg, rgba(184,164,255,0.08) 0 10px, transparent 10px 20px),
      linear-gradient(160deg, #2c2159, #1c1540);
    border:2px dashed var(--lavender);
    color:var(--cream-dim);
    font-size:clamp(14px,3.6vw,16px);
  }
  .placeholder .big{
    font-size:clamp(36px,9vw,44px);
  }
  .placeholder strong{
    color:var(--cream);
    font-family:'Fredoka', system-ui, sans-serif;
    font-size:clamp(16px,4.2vw,18px);
    font-weight:600;
  }

  .poem-eyebrow{
    margin:0 0 4px;
    font-family:'Noto Serif TC', serif;
    font-weight:500;
    font-size:clamp(13px,3.4vw,15px);
    letter-spacing:0.3em;
    color:var(--gold);
  }
  .poem{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
  }
  .poem-line{
    margin:0;
    font-family:'Noto Serif TC', serif;
    font-weight:700;
    font-size:clamp(20px,5.8vw,27px);
    letter-spacing:0.14em;
    color:var(--cream);
  }
  .replay{
    margin-top:4px;
    background:none;
    border:1.5px solid var(--lavender);
    color:var(--cream);
    font-family:'Nunito', sans-serif;
    font-weight:700;
    font-size:clamp(14px,3.6vw,16px);
    padding:11px 22px;
    border-radius:999px;
    cursor:pointer;
    transition:background .2s ease, transform .15s ease;
  }
  .replay:hover{background:rgba(184,164,255,0.15);}
  .replay:active{transform:scale(0.96);}
  .replay:focus-visible,
  .present-wrap:focus-visible .box{
    outline:2px solid var(--gold);
    outline-offset:4px;
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
  }
</style>
</head>
<body>

<div class="stars" aria-hidden="true" id="stars"></div>
<canvas id="confetti" aria-hidden="true"></canvas>

<main>
  <h1>Happy Birthday!</h1>
  <p class="tagline">please tap on the present</p>

  <div class="reveal" id="reveal" hidden>
    <div class="frame">
      <img id="drawing" src="drawing.jpg" alt="A drawing for Mom" onerror="this.hidden=true; document.getElementById('placeholder').hidden=false;">
      <div class="placeholder" id="placeholder" hidden>
        <span class="big">🎨</span>
        <strong>a drawing is on its way</strong>
        <span>(this spot is saved just for it)</span>
      </div>
    </div>
    <div class="message">
      <p class="poem-eyebrow">獻給小丸子阿媽</p>
      <div class="poem" id="poem">
        <p class="poem-line">十月廿六賀生辰，</p>
        <p class="poem-line">彎腰駝背像蝦仁。</p>
        <p class="poem-line">露齒一笑驚動眾，</p>
        <p class="poem-line">虎媽萬歲笑聲真。</p>
      </div>
    </div>
    <button class="replay" id="replay" type="button">open it again</button>
  </div>

  <div class="present-wrap" id="present" role="button" tabindex="0" aria-label="Open your present">
    <div class="lid"></div>
    <div class="bow"></div>
    <div class="box"></div>
  </div>
</main>

<script>
  // ambient stars
  (function(){
    var wrap = document.getElementById('stars');
    var n = 50;
    for (var i = 0; i < n; i++) {
      var s = document.createElement('div');
      s.className = 'star';
      s.style.left = (Math.random()*100) + '%';
      s.style.top = (Math.random()*100) + '%';
      s.style.animationDelay = (Math.random()*2.6) + 's';
      wrap.appendChild(s);
    }
  })();

  // confetti
  var canvas = document.getElementById('confetti');
  var ctx = canvas.getContext('2d');
  var particles = [];
  var rafId = null;
  var colors = ['#FF6B6B','#F5B942','#4ECDC4','#B8A4FF','#FBF7F0'];

  function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  function burstConfetti(originX, originY){
    var count = 140;
    for (var i = 0; i < count; i++) {
      var angle = Math.random() * Math.PI * 2;
      var speed = 4 + Math.random() * 9;
      particles.push({
        x: originX,
        y: originY,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 4,
        size: 5 + Math.random() * 5,
        color: colors[Math.floor(Math.random()*colors.length)],
        rot: Math.random() * Math.PI,
        vrot: (Math.random()-0.5) * 0.3,
        life: 0,
        maxLife: 160,
        gravity: 0.16,
        drag: 0.993,
        glow: false,
        shape: Math.random() > 0.5 ? 'rect' : 'circle'
      });
    }
    if (!rafId) rafId = requestAnimationFrame(tick);
  }

  // radiating spark burst, used for the fireworks
  function sparkBurst(originX, originY, color){
    var count = 48;
    for (var i = 0; i < count; i++) {
      var angle = (Math.PI * 2 * i) / count + (Math.random() * 0.25 - 0.125);
      var speed = 2.2 + Math.random() * 3.6;
      particles.push({
        x: originX,
        y: originY,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        size: 2 + Math.random() * 2,
        color: color,
        rot: 0,
        vrot: 0,
        life: 0,
        maxLife: 50 + Math.random() * 26,
        gravity: 0.035,
        drag: 0.96,
        glow: true,
        shape: 'circle'
      });
    }
    if (!rafId) rafId = requestAnimationFrame(tick);
  }

  function tick(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    var alive = false;
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.vy += p.gravity;
      p.vx *= p.drag;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vrot;
      p.life++;
      var fade = Math.max(0, 1 - p.life/p.maxLife);
      if (fade <= 0 || p.y > canvas.height + 40) {
        particles.splice(i,1);
        continue;
      }
      alive = true;
      ctx.save();
      ctx.globalAlpha = fade;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      if (p.glow) {
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 8;
      }
      if (p.shape === 'rect') {
        ctx.fillRect(-p.size/2, -p.size/3, p.size, p.size*0.6);
      } else {
        ctx.beginPath();
        ctx.arc(0,0,p.size/2,0,Math.PI*2);
        ctx.fill();
      }
      ctx.restore();
    }
    if (alive) {
      rafId = requestAnimationFrame(tick);
    } else {
      rafId = null;
      ctx.clearRect(0,0,canvas.width,canvas.height);
    }
  }

  // fireworks: random bursts around the screen, each labeled in a different language
  var fireworkPhrases = [
    { text: '生日快樂', color: '#FF6B6B' },
    { text: 'Happy Birthday!', color: '#F5B942' },
    { text: 'Alles Gute zum Geburtstag!', color: '#4ECDC4' },
    { text: '¡Feliz cumpleaños!', color: '#B8A4FF' }
  ];

  function fireworkLabel(x, y, text, color){
    var el = document.createElement('div');
    el.className = 'firework-label';
    el.textContent = text;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.color = color;
    document.body.appendChild(el);
    el.addEventListener('animationend', function(){ el.remove(); });
  }

  // builds the regions hugging each open side of a rect (clamped to the viewport),
  // so bursts land around the content instead of anywhere on screen
  function regionsAroundRect(rect, avoidAboveY){
    var vw = window.innerWidth, vh = window.innerHeight;
    var pad = 14, buffer = 38, minSpan = 46;
    var topLimit = pad;
    if (typeof avoidAboveY === 'number' && avoidAboveY < rect.top) {
      topLimit = Math.max(topLimit, avoidAboveY + buffer);
    }
    var regions = [];
    if (rect.left - buffer - pad > minSpan) {
      regions.push({
        x0: pad, x1: rect.left - buffer,
        y0: Math.max(pad, rect.top - 50), y1: Math.min(vh - pad, rect.bottom + 50)
      });
    }
    if ((vw - pad) - (rect.right + buffer) > minSpan) {
      regions.push({
        x0: rect.right + buffer, x1: vw - pad,
        y0: Math.max(pad, rect.top - 50), y1: Math.min(vh - pad, rect.bottom + 50)
      });
    }
    if (rect.top - buffer - topLimit > minSpan * 0.7) {
      regions.push({
        x0: Math.max(pad, rect.left - 30), x1: Math.min(vw - pad, rect.right + 30),
        y0: topLimit, y1: rect.top - buffer
      });
    }
    if ((vh - pad) - (rect.bottom + buffer) > minSpan * 0.7) {
      regions.push({
        x0: Math.max(pad, rect.left - 30), x1: Math.min(vw - pad, rect.right + 30),
        y0: rect.bottom + buffer, y1: vh - pad
      });
    }
    return regions;
  }

  function launchFireworksAround(rect, textRect, avoidAboveY){
    // the frame+poem block is often taller than a phone viewport, so a region that
    // clears both can be impossible — fall back to just clearing the poem text
    // (the frame is only decorative) before giving up and allowing anywhere
    var regions = regionsAroundRect(rect, avoidAboveY);
    if (!regions.length) regions = regionsAroundRect(textRect, avoidAboveY);
    if (!regions.length) {
      regions.push({ x0: 14, x1: window.innerWidth - 14, y0: 14, y1: window.innerHeight - 14 });
    }
    // keep the label (and its glow) fully inside the viewport, even in a narrow side column
    var halfLabelW = Math.min(75, window.innerWidth * 0.16) + 8;
    var halfLabelH = 34;
    var lastPhrase = -1;

    function spawnOne(){
      var pIdx = Math.floor(Math.random() * fireworkPhrases.length);
      if (pIdx === lastPhrase) pIdx = (pIdx + 1) % fireworkPhrases.length;
      lastPhrase = pIdx;
      var p = fireworkPhrases[pIdx];
      var r = regions[Math.floor(Math.random() * regions.length)];
      var x = r.x0 + Math.random() * Math.max(1, r.x1 - r.x0);
      var y = r.y0 + Math.random() * Math.max(1, r.y1 - r.y0);
      x = Math.min(Math.max(x, halfLabelW), window.innerWidth - halfLabelW);
      y = Math.min(Math.max(y, halfLabelH), window.innerHeight - halfLabelH);
      sparkBurst(x, y, p.color);
      fireworkLabel(x, y, p.text, p.color);
    }

    // keep spamming fireworks around the content for ~5 seconds
    var duration = 5000, spacing = 300, elapsed = 0;
    spawnOne();
    var spamInterval = setInterval(function(){
      elapsed += spacing;
      spawnOne();
      if (elapsed >= duration) clearInterval(spamInterval);
    }, spacing);
  }

  // present interaction
  var present = document.getElementById('present');
  var reveal = document.getElementById('reveal');
  var replay = document.getElementById('replay');
  var heading = document.querySelector('h1');
  var tagline = document.querySelector('.tagline');
  var opened = false;

  function openPresent(){
    if (opened) return;
    opened = true;
    present.classList.add('opened');
    present.blur(); // the box growing below it can otherwise trigger the browser's focus-follow autoscroll
    heading.classList.add('intro-fade');
    tagline.classList.add('intro-fade');
    // wait until the reveal's burst-out animation (350ms delay + 800ms transition) is
    // done before collapsing their layout space, so that space doesn't shift mid-flight
    setTimeout(function(){
      heading.hidden = true;
      tagline.hidden = true;
    }, 1300);
    var rect = present.getBoundingClientRect();
    burstConfetti(rect.left + rect.width/2, rect.top + rect.height*0.3);
    setTimeout(function(){
      reveal.hidden = false;
      window.scrollTo(0, 0); // instant, so the FLIP math below measures the settled layout

      // FLIP: snap the reveal to the present's position/scale, then transition it
      // to its natural (now top-of-page) spot, so it visibly bursts out of the present
      var revealRect = reveal.getBoundingClientRect();
      var presentRect = present.getBoundingClientRect();
      var dx = (presentRect.left + presentRect.width / 2) - (revealRect.left + revealRect.width / 2);
      var dy = (presentRect.top + presentRect.height / 2) - (revealRect.top + revealRect.height / 2);
      reveal.style.transition = 'none';
      reveal.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(0.1)';
      reveal.style.opacity = '0';
      reveal.offsetHeight; // force reflow so the start state actually applies
      reveal.style.transition = '';

      requestAnimationFrame(function(){
        reveal.classList.add('show');
        reveal.style.transform = 'translate(0,0) scale(1)';
        reveal.style.opacity = '1';
      });

      // wait for the burst-out transform to actually finish (it overshoots past its
      // final size) before measuring — measuring mid-overshoot puts fireworks at
      // positions that end up inside the settled frame instead of around it
      reveal.addEventListener('transitionend', function onSettled(e){
        if (e.target !== reveal || e.propertyName !== 'transform') return;
        reveal.removeEventListener('transitionend', onSettled);
        var frameRect = document.querySelector('.frame').getBoundingClientRect();
        var messageRect = document.querySelector('.message').getBoundingClientRect();
        var taglineBottom = document.querySelector('.tagline').getBoundingClientRect().bottom;
        launchFireworksAround({
          left: Math.min(frameRect.left, messageRect.left),
          right: Math.max(frameRect.right, messageRect.right),
          top: Math.min(frameRect.top, messageRect.top),
          bottom: Math.max(frameRect.bottom, messageRect.bottom)
        }, messageRect, taglineBottom);
      });
    }, 350);
  }

  present.addEventListener('click', openPresent);
  present.addEventListener('keydown', function(e){
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      openPresent();
    }
  });

  replay.addEventListener('click', function(){
    reveal.classList.remove('show');
    reveal.style.opacity = '0';
    heading.hidden = false;
    tagline.hidden = false;
    requestAnimationFrame(function(){
      heading.classList.remove('intro-fade');
      tagline.classList.remove('intro-fade');
    });
    setTimeout(function(){
      reveal.hidden = true;
      reveal.style.transform = '';
      reveal.style.opacity = '';
      present.classList.remove('opened');
      opened = false;
    }, 500);
  });
</script>

</body>
</html>
